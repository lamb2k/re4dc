# Crash suite (fp_gate.py --conf crash.conf --align, twin built with FP_TWIN_EXTRA=W11_FIXTURE=1): short warped runs
# in representative scenes on the hwmodel Flycast with the align logger (interpreter, HWTRACE_ALIGN=1). A misaligned
# 16/32-bit access is an address error on a Dreamcast but Flycast performs it silently; every segment must log
# 0 MISALIGN (hwtrace.log) as well as pass the full-play rules. Added 2026-10-14 after console test 11 (eb4e8813)
# faulted after the first radio call (code 0e0, walk_signature) although a 37-minute dynarec run passed.
# The interpreter runs about 9 game frames per wall second: seconds below are wall seconds (caps), each segment
# covers about 1000-2500 game frames around its event. Same columns as segments.conf; <x>-w11.txt next to <x>-warp.txt
# is passed as /cd/dc/w11.txt (W11_FIXTURE: die / save). 5-minute rule (2026-10-14): each segment stops ~20 s after
# its moment; realcall (the untouched disc from boot, ~10 min on the interpreter) moved to crash-extra.conf.
# HWTRACE_ALIGN runs only on the interpreter: the dynarec reads guest memory through fastmem host loads with
# no hook (hwready.patch wraps the interpreter's ReadMem/WriteMem handlers), and Flycast cannot switch cores mid-run.
