# Full-play gate segments (fp_gate.py). One Flycast run each, run in parallel, longest first.
# name | disc | seconds | warp | pad | keys | vmu | stop regex | grace s | goals (;; separated, each must appear) | how | what it covers
#  5-minute rule (user, 2026-10-14): every segment ends within ~5 min wall and all run at once up to the Flycast cap;
#  seconds is only a hang cap (<= 420). The 30-minute `long` moved to long.conf (opt-in); `cache` answers its question.
#  disc: real = the release tracks themselves (unmodified, host keyboard only); rel = release binary + this segment's
#        padscript (data tree identical); twin = twin binary (diagnostic knobs) + warp/padscript (data tree identical)
#  how:  real = played from boot; scripted = played by a pad script from boot; warped = starts at a warp point
#  vmu:  - = the harness template (blank: the game creates its system file); save = the user VMU with a r102 save
