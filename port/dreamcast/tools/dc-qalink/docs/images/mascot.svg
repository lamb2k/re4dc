<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Dialo: original mascot art for dc-qalink (MIT). A spiky-haired modem-plug hero, mid-dash. -->
  <title>Dialo, the dc-qalink mascot</title>
  <!-- speed lines -->
  <g stroke="#ff8a1f" stroke-width="8" stroke-linecap="round">
    <line x1="18" y1="130" x2="78" y2="130"/>
    <line x1="8" y1="160" x2="62" y2="160"/>
    <line x1="24" y1="190" x2="74" y2="190"/>
  </g>
  <!-- coiled phone cord trailing behind -->
  <path d="M112 236 q-14 -14 -28 0 q-14 14 -28 0 q-14 -14 -28 0" fill="none" stroke="#2a5bd7" stroke-width="7"
        stroke-linecap="round"/>
  <!-- spiky hair, swept back -->
  <path d="M120 92 L70 70 L118 66 L84 34 L138 50 L132 12 L172 46 L196 18 L204 58 L250 52 L222 86 Z"
        fill="#1f4fd1" stroke="#0d1b4a" stroke-width="5" stroke-linejoin="round"/>
  <!-- body: a modem plug -->
  <rect x="108" y="74" width="140" height="150" rx="34" fill="#2a6cf0" stroke="#0d1b4a" stroke-width="6"/>
  <!-- plug contacts on the chest -->
  <rect x="146" y="176" width="64" height="30" rx="6" fill="#ffd34d" stroke="#0d1b4a" stroke-width="4"/>
  <g stroke="#0d1b4a" stroke-width="4">
    <line x1="162" y1="180" x2="162" y2="202"/><line x1="178" y1="180" x2="178" y2="202"/>
    <line x1="194" y1="180" x2="194" y2="202"/>
  </g>
  <!-- face -->
  <ellipse cx="190" cy="126" rx="46" ry="36" fill="#ffe2c2" stroke="#0d1b4a" stroke-width="5"/>
  <ellipse cx="176" cy="122" rx="10" ry="15" fill="#fff" stroke="#0d1b4a" stroke-width="4"/>
  <ellipse cx="206" cy="122" rx="10" ry="15" fill="#fff" stroke="#0d1b4a" stroke-width="4"/>
  <circle cx="180" cy="125" r="5" fill="#0d1b4a"/>
  <circle cx="210" cy="125" r="5" fill="#0d1b4a"/>
  <path d="M178 146 q14 12 30 0" fill="none" stroke="#0d1b4a" stroke-width="5" stroke-linecap="round"/>
  <!-- antenna with a signal -->
  <line x1="230" y1="80" x2="258" y2="40" stroke="#0d1b4a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="260" cy="36" r="9" fill="#ff8a1f" stroke="#0d1b4a" stroke-width="4"/>
  <g fill="none" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round">
    <path d="M276 22 q10 14 0 28"/><path d="M290 12 q16 24 0 48"/>
  </g>
  <!-- arms -->
  <path d="M112 150 q-26 6 -36 -14" fill="none" stroke="#0d1b4a" stroke-width="10" stroke-linecap="round"/>
  <path d="M246 156 q26 -4 36 -26" fill="none" stroke="#0d1b4a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="74" cy="132" r="11" fill="#fff" stroke="#0d1b4a" stroke-width="4"/>
  <circle cx="284" cy="126" r="11" fill="#fff" stroke="#0d1b4a" stroke-width="4"/>
  <!-- legs mid-stride and sneakers -->
  <path d="M150 222 l-22 40" stroke="#0d1b4a" stroke-width="10" stroke-linecap="round"/>
  <path d="M206 222 l26 34" stroke="#0d1b4a" stroke-width="10" stroke-linecap="round"/>
  <path d="M96 262 q4 -18 34 -14 q18 2 22 18 z" fill="#ff8a1f" stroke="#0d1b4a" stroke-width="5"
        stroke-linejoin="round"/>
  <path d="M220 258 q6 -18 36 -12 q18 4 20 20 z" fill="#ff8a1f" stroke="#0d1b4a" stroke-width="5"
        stroke-linejoin="round"/>
  <path d="M100 262 h50 M224 262 h50" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- shadow -->
  <ellipse cx="186" cy="290" rx="90" ry="9" fill="#000" opacity="0.15"/>
</svg>
