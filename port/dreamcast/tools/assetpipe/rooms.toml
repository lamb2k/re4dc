# Per-room recipes. A room not listed here uses [defaults]: its local SMD BINs
# (room_smd.py) from St*/<room>.das in the GC disc image, LOD packages, class-auto tags.
# "recipe" holds the hand-tuned converter arguments that produced the accepted packages
# (--plan recipe reproduces them byte for byte); --plan solve (default) replaces the
# per-BIN bias/floor choices by the solver's (costmodel.toml).

[route]
rooms = ["r100", "r101", "r103"]

[material_pairs]            # color:mask image identities of model parts drawn from one pair package
# (prepare_native_ui.material_pair_identity). New ones come from run logs' "pair missing" lines
# (pairs_from_log.py); these 9 r101 pairs (st1/r101.arc TPL 4) were recovered by hashing, before
# that log line existed (warp-r101-pbdoor4: "package rejected: open failed").
pairs = [
    ["364dabd6-66e859d7", "45526173-bbdb5505"], ["364dabd6-66e859d7", "5bcbcb7b-3e187023"],
    ["364dabd6-66e859d7", "3b3773c0-ca18c316"], ["364dabd6-66e859d7", "0d05b1bf-08b569e0"],
    ["be099934-40a0a2d7", "3e902092-e4e309f3"], ["7c9873e2-9f7651a0", "ecb9ac8b-26f69e3e"],
    ["d6dac98a-dde12c66", "6ec22ec5-86285dab"], ["a8d6ad09-e94a8f35", "8cd159eb-c6faa607"],
    ["77bcda6e-2a354924", "3773a372-bd6d036f"],
    # r103, from the runtime's pair-missing lines (warp-r101-pbdoor5)
    ["d6dac98a-dde12c66", "5c822bd9-c797afd4"], ["20b41c62-133dd8fa", "c8b602c8-633b846d"],
    # images in ss/cmn/ss_oc101.dat (12a489ae, 5e3c1264, 2b388d2d) and the route events (9264be9a)
    ["12a489ae-40772dd6", "5e3c1264-a53c4db5"], ["9264be9a-41e48d57", "2b388d2d-af0e5096"],
    # r101 first entry (bswap-rtp2) and the r100 house fight (user play log, 2026-09-24)
    ["a6d90f64-9a95aa05", "3976971a-8be3b5b1"], ["4d28f9bb-8deaf624", "8ecb10ec-b516c37d"],
    ["1770ec7a-8119b489", "b308228f-3f8462a1"], ["3d9d333a-125fadf1", "d56e57e8-6edc9482"],
    # r10b boarding (st1/r10b.arc entry 27 TPL images 0/1; lake-20261010 "pair missing 18d0fd82-2c9a9309")
    ["71edfaa9-5e1dd270", "a1c67505-45451a25"],
]

[defaults]
kind = "smd"                 # BINs + placements from the room SMD
owner = "0xff"
stage = "MESHROOMS"          # /cd/dc/native/<room>/*.re4mesh
w9b = true                   # use --lod-floor/--lod-share/--class-auto when the converter has them

[room.r100]
kind = "export"              # r100: seven owners from the GC export + reclaim placements
stage = "MESHDIR"
keyed = true                 # stage.sh KEYED .re4room files (pinned)
w9b = false                  # LD packages are R4IM v2 without W9b options
owners = [
  { name = "MAINSCENARIO", owner = "0xff", bins = "R100.FILE_MAIN" },
  { name = "FILE_00", owner = "0", bins = "R100.FILE_0" },
  { name = "FILE_01", owner = "1", bins = "R100.FILE_1" },
  { name = "FILE_02", owner = "2", bins = "R100.FILE_2" },
  { name = "FILE_03", owner = "3", bins = "R100.FILE_3" },
  { name = "FILE_04", owner = "4", bins = "R100.FILE_4" },
  { name = "COMMON", owner = "0xfe", bins = "R100.FILE_SHARED", common = true },
]

[room.r100.trees]            # PS2 trees (approved): GC COMMON 0-10 <- r100_004 BIN 139-147
gc = "0xfe:0-10"
ps2_obj = "${ps2_r100}/r100_004.scenario.obj"
bark_png = "${r100_bark_png}"
bark_key = "f6e54e3e-1ef21097"

[room.r100.recipe]           # LD (README "r100 PS2 tree packages") rebuilt by the W9b converter (R4IM v3, 8332a22)
bias = ["0xfe:0-10=0.375"]
substitute = ["trees", "planar2"]
# The packages every route disc has staged since W9b. The pre-W9b LD pins (COMMON cdeade63..., MAINSCENARIO
# f4b31f51..., FILE_01 69c135fd...) predate the R4IM v3 format and failed every build's check.
expect = { COMMON = "799c3ac8c7562293a41d8fdbc7e71105c88a212e411e28ef3b3e40b4fc712e9a", MAINSCENARIO = "daea2c21708a95571b093d7fdd2705355bc0265fa6211f274de8df904efd4e35", FILE_01 = "6ce0430881442d16c6df8a3223700b322e7055351f36719db608a91fbef61011" }

[room.r100.standard]         # Standard (default, budget-first) plan inputs; classes the heuristics can't tell
houses = ["1:17", "1:18"]    # item 21 house shells (bl_house_shell.py)
landmarks = []               # never culled, never below bias 1

[room.r100.standard.plan]
house_tex = 128              # user 2026-09-23: 128 x 128 shell textures (r100's VRAM pool is full:
                             # 512 VQ is 66 KB a house, 128 is 6 KB)
impostors = { views = 8, cell = 128 }   # user 2026-09-23 (VRAM trim r100-a): the item 20 Blender bake of the
                                        # 5 PS2 tree models re-run at 8 views (generators.tree_bake; 1024x128)

[room.r100.demand]           # discover: heap 4 room for enemy archives (Original, canonical recipe), measured
enemy_heap4_bytes = 1774176   # warp-ea4-after: free 0xcd80 at the em23 read with em12 0x10dd00 + em21 0x53180 + em2a 0x43660 live
enemy_heap4_source = "warp-ea4-after (e6f65cc arm, Original, r100 after state)"

[room.r100.views]            # named review/pricing views; cam/toward from SCEN_LOG (scenery trials tour, arm C, 25 m);
                             # the game camera direction is not logged: cam->player is used, which matches the
                             # spawn frame (kept as a reference) but not the walking frames
spawn = { cam = [-100308, 1310, -209], toward = [-99692, -454, -1343], pitch = -10.0, frame = "scen-tour-C/frames/fc02400_fb0.png" }
path_a = { cam = [-94321, 1696, -2688], toward = [-93703, -68, -3823], pitch = -10.0 }
path_b = { cam = [-88030, 1724, -6559], toward = [-87413, -40, -7694], pitch = -10.0 }
house = { bin = "1:17", from = "spawn", distances_m = [30.0, 8.0, 3.0] }
widest = { grid = "max_original_ms" }

[room.r101]
das = "St1/r101.das"

[room.r101.trees]            # GC 13-16 <- PS2 81+82, 78, 79, 80; GC bark kept
gc = "0xff:13-16"
ps2_bins = "78-82"
ps2_obj = "${ps2_r101}/r101_004.scenario.obj"

[room.r101.recipe]           # tools/d367/README.md W9b
bias = ["0xff:13-17=0.375", "0xff:3,9,12,34,70,64,31,29,38=0.25"]
floor = 2
share = true
classes = ["0xff:13-17=tree"]
class_auto = true
substitute = ["trees"]
expect = { MAINSCENARIO = "a2451febc6285d2126bb8255b56569f844edf1299a2e271f5ae113dd7ef20288" }   # W9 m-r101-FIN

[room.r101.standard]         # houses: picked by size (houses_auto), kept only where a shell fits (house_err_cm)
houses = []
landmarks = ["0xff:45"]      # user 2026-09-23: the well in the village square (fight area) keeps its real mesh
review_notes = [
  "Houses: 9 BINs picked by size (radius 5-15 m, >= 700 tris, >= 4 m tall, at most 2 placements) and kept where a shell ladder rung fits (p90 <= 30 cm): 48 to 400 faces, 64 x 64 baked textures (VRAM trim 2, user 2026-09-23).",
  "BIN 45 (the house with the well in the village square) is a landmark (user 2026-09-23): real mesh, bias 1, never culled, no shell.",
  "Trees: 8-view impostor atlases rendered by the pipeline (impostor.py; VRAM trim 1, user 2026-09-23). The groves (BINs 13 and 17) are split into single trees, one 8-view atlas per tree (s16.5).",
  "The ground (BIN 12, one 165 x 125 m mesh) costs about 1 ms at every view even at its coarsest option.",
  "Fences, posts and other clutter are culled only beyond 15 m here, and no object vanishes nearer than in Original (vanish guard).",
]

[room.r101.standard.plan]
house_tex = 64               # user 2026-09-23 (VRAM trim 2): 64 x 64 (3 KB each; 128 is 6 KB, 256 is 18 KB)
houses_auto = { min_radius_mm = 5000.0, max_radius_mm = 15000.0, min_tris = 700, min_height_mm = 4000.0, max_instances = 2 }
impostors = { views = 8, cell = 128, ss = 4 }    # user 2026-09-23 (VRAM trim 1): whole-BIN tree atlases at 8 views
grove_split = { views = 8, cell = 128, ss = 4 }  # user 2026-09-23 (option B): groves split into trees, one
                                                 # 8-view 512x128 atlas per tree (s16.5)
# fences, posts and rails are clutter-sized: culled at 6 m they vanish from the cow pen and the
# village (review 2026-09-23), so these rooms only cull clutter beyond 15 m (fog is ~50 % there)
options = { tree = { bias = [1.0, 0.5, 0.25, 0.125], imp_mm = [0, 12000, 8000, 6000, 4000, 3000] }, ground = { bias = [1.0, 0.5, 0.25, 0.125, 0.0625] }, clutter = { bias = [1.0, 0.5, 0.25], cull_mm = [0, 15000] } }

[room.r101.standard.budget_context]   # review sheet: heap 4 / VRAM against the route plan (design-r103 PLAN.md)
heap4 = [ { case = "r101 on the m1 recipe, at entry (design-r103 estimate)", original_free_kb = [1460, 1460] } ]
heap4_margin_kb = 155
vram = { pool = 2578176, original_used = 2428032, source = "r101 measured, design-r103 PLAN" }
note = "Heap 4 free is Original's estimate minus the Standard package delta; the margin is the 155 KB kept at r100 s40 / r101."

[room.r101.demand]           # discover: heap 4 room for enemy archives (canonical recipe), measured
enemy_heap4_bytes = 3048704   # heap4 census in the fight: free 1,595,136 with em15 0x116300 + em26 0x2c0a0 + em28 0x20a60 live
enemy_heap4_source = "warp-dbp0-fight-orig (Original) = warp-dbp0-fight (Standard), edf0cc4 canonical + DBG_WARP"

[room.r101.views]            # spawn: r100 AEV record 0 (door to r101) dstPos/dstAngle, the camera 0.3 m behind
                             # the head (1.29 m back, as at r100, is inside the slope); fight: the village square,
                             # ESL em15 20-31 at x -11..6 m, z -2..3 m (emleon00.esl, 10 mm units); house: the
                             # 400-face shell of BIN 64 from the fight camera; w9_worst: W9 m-r101-FIN grid_3_1
spawn = { player = [-52144.4, 90.6, 22524.3], angle = 2.122, back_mm = 300.0, up_mm = 1700.0, pitch = -5.0 }
fight = { eye_xz = [-20000.0, 9000.0], at_xz = [-4000.0, 0.0] }
fight_in = { eye_xz = [2000.0, -6000.0], at_xz = [-9000.0, 1000.0] }
house = { bin = "0xff:64", from = "fight", distances_m = [20.0, 8.0] }
w9_worst = { eye = [3297.0, 1798.0, -19715.0], yaw = 315.0 }
widest = { grid = "max_original_ms" }

[room.r103]
das = "St1/r103.das"

[room.r103.recipe]           # tools/d367/README.md W9b
bias = ["0xff:38,59,60,62-67=0.375", "0xff:0,18,61,17,24,28=0.375"]
floor = 2
share = true
classes = ["0xff:38,59,60,62-67=tree"]
class_auto = true
expect = { MAINSCENARIO = "1de5104140632d79016860533314a6863b390cadac248852502f42dfd9c54349" }   # W9 m-r103-FIN

[room.r103.standard]
houses = []
landmarks = []
review_notes = [
  "Houses: 3 BINs shelled (5, 6, 7: 48 faces, p90 15-23 cm) with 256 x 256 baked textures; BIN 1, also picked by size, is all alpha-masked (nothing to shell) and stays a biased structure.",
  "Trees: impostor atlases rendered by the pipeline (impostor.py). The groves (BINs 38 and 63) are split into single trees (s16.5). BIN 59, one 7 m tree the camera can stand inside, is split into 8 regions of ~500 triangles that pick their own levels (user 2026-09-23, option B).",
  "The cow pen fences stay (clutter is culled only beyond 15 m here, and the vanish guard keeps Original's LOD vanish distance).",
  "Actors are outside this sheet: 5 Ganados, 10 corpses (they stay: gore rule), 6 cows, 6 chickens, 1 dog. r103 has no events and no FMV.",
]

[room.r103.standard.plan]
house_tex = 256
houses_auto = { min_radius_mm = 5000.0, max_radius_mm = 15000.0, min_tris = 700, min_height_mm = 4000.0, max_instances = 2 }
impostors = { views = 16, cell = 128, ss = 4 }   # tree atlases rendered by impostor.py
grove_split = { views = 8, cell = 128, ss = 4 }  # user 2026-09-23 (option B): groves split into trees, one
                                                 # 8-view 512x128 atlas per tree (s16.5)
cluster_bins = ["0xff:59=8000"]  # user 2026-09-23 (BIN 59 option B): the 7 m tree is one cluster at the default
                                 # size, so a camera inside its box draws all 3,973 triangles; 8 m clusters
                                 # (--lod-cluster-bins) give 8 regions of ~500 that pick their own levels
# fences, posts and rails are clutter-sized: culled at 6 m they vanish from the cow pen and the
# village (review 2026-09-23), so these rooms only cull clutter beyond 15 m (fog is ~50 % there)
options = { tree = { bias = [1.0, 0.5, 0.25, 0.125], imp_mm = [0, 12000, 8000, 6000, 4000, 3000] }, ground = { bias = [1.0, 0.5, 0.25, 0.125, 0.0625] }, clutter = { bias = [1.0, 0.5, 0.25], cull_mm = [0, 15000] } }

[room.r103.standard.budget_context]
heap4 = [ { case = "with the W8b r103 room-archive compaction (after W11's 175 KB)", original_free_kb = [1100, 1550] },
          { case = "without W8b (not implemented yet)", original_free_kb = [-350, -200] } ]
heap4_margin_kb = 155
heap4_gate_kb = 330
vram = { pool = 2578176, original_used = 2245760, source = "estimate, not measured: r101's non-room VRAM + r103's room textures" }
note = "Original free ranges from design-r103 PLAN.md section 3; the W8d gate is 330 KB free (155 margin + 175 W11). Standard free = Original free - (Standard - Original) scenery package bytes. The corpses stay (gore rule) and are not part of the scenery budget."

# [room.r103.demand]: not measurable yet. r103 needs the W8b room-archive compaction to load
# (budget_context above; the r103 go-ahead is a pending user decision). Measure at its first run.

