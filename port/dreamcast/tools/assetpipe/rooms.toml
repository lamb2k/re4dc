                             # with enemies (cows, ESL 95/97); w9_worst: W9 grid_4_4
spawn = { player = [-47609.06, 11.83, 7083.56], angle = 1.889, back_mm = 300.0, up_mm = 1700.0, pitch = -5.0 }
cow_pen = { eye = [-24621.0, 2360.0, -31179.0], yaw = 45.0 }
house = { bin = "0xff:6", from = "cow_pen", distances_m = [20.0, 8.0] }
w9_worst = { eye = [707.0, 1921.0, -457.0], yaw = 225.0 }
widest = { grid = "max_original_ms" }
